name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate rounded icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null
          Add-Type -AssemblyName System.Drawing
          $src = [System.Drawing.Image]::FromFile((Resolve-Path "app-icon.png"))
          $size = [Math]::Min($src.Width, $src.Height)
          $srcX = [int](($src.Width - $size) / 2)
          $srcY = [int](($src.Height - $size) / 2)

          $dst = New-Object System.Drawing.Bitmap($size, $size, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
          $g = [System.Drawing.Graphics]::FromImage($dst)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $g.Clear([System.Drawing.Color]::Transparent)

          $r = [int]($size * 0.22)
          $d = $r * 2
          $path = New-Object System.Drawing.Drawing2D.GraphicsPath
          $path.AddArc(0, 0, $d, $d, 180, 90)
          $path.AddArc($size - $d, 0, $d, $d, 270, 90)
          $path.AddArc($size - $d, $size - $d, $d, $d, 0, 90)
          $path.AddArc(0, $size - $d, $d, $d, 90, 90)
          $path.CloseFigure()

          $g.SetClip($path)
          $srcRect = New-Object System.Drawing.Rectangle($srcX, $srcY, $size, $size)
          $dstRect = New-Object System.Drawing.Rectangle(0, 0, $size, $size)
          $g.DrawImage($src, $dstRect, $srcRect, [System.Drawing.GraphicsUnit]::Pixel)

          $src.Dispose()
          $g.Dispose()
          $dst.Save("build/icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $dst.Dispose()

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        run: npm run build

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeShelf-Pro-Windows
          path: dist/*.exe
